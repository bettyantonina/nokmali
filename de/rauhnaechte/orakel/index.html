<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Zieh deine Karte · Rauhnächte | Nokmali</title>
  <meta name="description" content="Ziehe deine Karte für den Tag, die Woche oder den Monat – ganz in deinem Rhythmus.">
  <meta name="theme-color" content="#E7ECE9">
  <link rel="preload" as="image" href="./art/cards/cover.webp" fetchpriority="high">
  <link rel="canonical" href="https://nokmali.com/de/rauhnaechte/orakel/">
  <link rel="icon" href="../../../favicon.ico">
  <link rel="stylesheet" href="./orakel.css?v=28">
  <script src="./cards.js?v=16" defer></script>
  <script src="./orakel.js?v=26" defer></script>
</head>
<body>
<a class="skip-link" href="#hit">Zum Kartendeck</a>
<main class="stage" id="stage" data-phase="deck">
<header class="top" data-screen-label="Orakel">
<a class="brand" href="../../index.html" aria-label="Nokmali Startseite"><img src="../../../art/nokmali-bowl-logo.png" alt=""><span>Nokmali</span></a>
<button class="pill" id="restart" type="button" hidden>← Neu beginnen</button>
<a class="pill" id="toMed" href="../index.html">Zu den Meditationen</a>
</header>
<div class="table" id="table">
<div class="inner" id="inner">
<div class="intro" id="intro">
<p class="eyebrow">Deine Rauhnächte · Orakel</p>
<h1>Zieh deine Karte</h1>
<p class="copy">Für einen Tag, eine Woche oder einen Monat – du entscheidest. Atme durch. Komm bei dir an. Folge deinem Gefühl.</p>
</div>
<button class="hit" id="hit" type="button" aria-label="Kartendeck. Gedrückt halten zum Mischen" aria-describedby="say"></button>
</div>
</div>
<div class="dock" id="dock">
<ol class="steps" id="steps" aria-hidden="true"><li data-s="deck">Mischen</li><li data-s="choose">Wählen</li><li data-s="reveal">Lesen</li></ol>
<p class="say" id="say" role="status" aria-live="polite"></p>
<div class="actions" id="actions"><button class="pill" id="browse-deck" type="button" aria-haspopup="dialog">Alle Karten ansehen</button></div>
</div>
<section class="reading" id="reading" hidden aria-labelledby="rTitle">
<div class="slot" id="slot"><div class="flip" id="flip"><div class="face back"></div><div class="face front"><img id="rImg" alt=""></div></div></div>
<button class="cue" id="cue" type="button">Lesen<span aria-hidden="true">↓</span></button>
<article class="panel" id="panel" tabindex="-1">
<p class="eyebrow">Deine Karte</p>
<h2 id="rTitle"></h2>
<div class="text" id="rText" tabindex="0" aria-label="Beschreibung der Karte"></div>
<div class="impulse" id="rImpulse"><p class="eyebrow" id="rLabel">Impuls</p><p id="rIntention"></p></div>
<div class="actions"><button class="btn" id="again" type="button">Noch eine Karte ziehen ↻</button><button class="btn ghost" id="save-card" type="button" disabled>Bild speichern oder teilen</button><a class="btn ghost" id="download-card" hidden>Bild herunterladen</a></div>
<p class="save-status" id="save-status" role="status"></p></article>
</section>
</main>
<dialog class="gallery-dialog" id="deck-gallery" aria-labelledby="gallery-title"><div class="gallery-header"><h2 id="gallery-title">Alle Orakelkarten</h2><button class="pill" id="close-gallery" type="button">Schließen</button></div><div class="gallery-grid" id="gallery-grid"></div></dialog><noscript>Bitte aktiviere JavaScript, um eine Karte zu ziehen.</noscript>
</body>
</html>

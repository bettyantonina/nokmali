  <style>
    @font-face {
      font-family: "Fluxisch Else";
      src: url("../fonts/FluxischElse-Light.otf") format("opentype");
      font-weight: 300;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fluxisch Else";
      src: url("../fonts/FluxischElse-Regular.otf") format("opentype");
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: "Fluxisch Else";
      src: url("../fonts/FluxischElse-Bold.otf") format("opentype");
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --paper: #F4EFE6;
      --paper-2: #EAE3D5;
      --ink: #3A3640;
      --ink-soft: #6C6560;
      --blue: #4F6E8B;
      --gold: #CDB377;
      --line: #DBD2C2;
      --f-display: "Fluxisch Else", "Hanken Grotesk", system-ui, sans-serif;
      --f-body: "Hanken Grotesk", system-ui, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: #D8E5E2 url("../art/thank-you-art-wide.jpg") 78% center / cover no-repeat fixed;
      color: var(--ink);
      font-family: var(--f-body);
      line-height: 1.62;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(244, 239, 230, 0.2), rgba(244, 239, 230, 0) 48%);
    }

    a {
      color: inherit;
    }

    .wrap {
      width: min(1140px, calc(100% - 88px));
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    nav {
      padding: 20px 0;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 11px;
      font-family: var(--f-display);
      font-size: 28px;
      font-weight: 700;
      text-decoration: none;
      text-shadow: 0 1px 12px rgba(244, 239, 230, 0.9);
    }

    .brand img {
      width: 42px;
      height: 42px;
      object-fit: contain;
    }

    main {
      padding: 28px 0 72px;
    }

    .thank-you {
      display: flex;
      align-items: center;
      min-height: min(680px, calc(100vh - 150px));
    }

    .copy {
      display: flex;
      flex-direction: column;
      justify-content: center;
      width: min(520px, 48%);
      padding: clamp(38px, 5vw, 64px);
      border: 1px solid rgba(219, 210, 194, 0.88);
      border-radius: 16px;
      background: rgba(244, 239, 230, 0.6);
      box-shadow: 0 28px 70px -42px rgba(39, 36, 32, 0.8);
    }

    .eyebrow {
      color: var(--blue);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    h1 {
      font-family: var(--f-display);
      font-size: clamp(46px, 6vw, 76px);
      font-weight: 300;
      line-height: 0.98;
      letter-spacing: -0.025em;
      margin-bottom: 28px;
    }

    h1 em {
      color: var(--blue);
      font-style: italic;
      font-weight: 300;
    }

    .lead {
      max-width: 31em;
      color: var(--ink-soft);
      font-size: 18px;
      margin-bottom: 16px;
    }

    .note {
      color: var(--ink-soft);
      font-size: 15px;
      margin-bottom: 30px;
    }

    .note a {
      color: var(--blue);
      font-weight: 600;
      text-decoration-thickness: 1px;
      text-underline-offset: 3px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      gap: 10px;
      padding: 14px 28px;
      border: 1px solid var(--blue);
      border-radius: 40px;
      background: var(--blue);
      color: #F6F1E8;
      font-size: 15px;
      font-weight: 500;
      text-decoration: none;
      transition: transform 0.2s, background 0.2s;
    }

    .btn:hover {
      background: #42607B;
      transform: translateY(-2px);
    }

    @media (max-width: 800px) {
      body {
        background-image: url("../art/thank-you-art-wide.jpg");
        background-position: 72% center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment: scroll;
      }

      .wrap {
        width: min(100% - 44px, 680px);
      }

      .thank-you {
        align-items: flex-end;
      }

      .copy {
        width: min(100%, 520px);
        padding: 48px 30px 52px;
      }
    }

    @media (max-width: 480px) {
      body {
        background-position: 68% center;
      }

      main {
        padding-top: 12px;
      }

      .thank-you {
        min-height: calc(100vh - 120px);
      }

      .copy {
        background: rgba(244, 239, 230, 0.64);
      }
    }
  </style>
</head>
<body>
  <nav aria-label="Primary navigation">
    <div class="wrap">
      <a class="brand" href="/">
        <img src="../art/nokmalilogo.png" alt="">
        <span>Nokmali</span>
      </a>
    </div>
  </nav>

  <main>
    <div class="wrap">
      <section class="thank-you">
        <div class="copy">
          <p class="eyebrow">Your clarity call is booked</p>
          <h1>Thank <em>you</em>.</h1>
          <p class="lead">I&rsquo;m looking forward to meeting you. You&rsquo;ll receive a confirmation email with the details for our call.</p>
          <a class="btn" href="/">Back to Nokmali <span aria-hidden="true">&rarr;</span></a>
        </div>
      </section>
    </div>
  </main>
</body>
</html>

  <style>
    :root {
      --paper: #F4EFE6;
      --ink: #3A3640;
      --ink-soft: #6C6560;
      --cta: #557D71;

      --line: #DBD2C2;

    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--f-body);

      -webkit-font-smoothing: antialiased;
    }

    main {
      width: min(100%, 560px);

      min-height: 46px;
      border: 1px solid var(--cta);
      border-radius: 999px;
      padding: 12px 18px;

      color: #fff;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      background: var(--cta-hover);
      border-color: var(--cta-hover);

    }

<body>
  <main>
    <h1>Tracking disabled on this browser.</h1>
    <p>PostHog will no longer capture pageviews, clicks or session recordings from this browser unless tracking is enabled again.</p>
    <button id="enable-tracking" type="button">Enable tracking again</button>
    <p class="status" id="tracking-status" role="status" aria-live="polite"></p>
  </main>

  <script>
    (function () {
      var status = document.getElementById("tracking-status");
      var enableButton = document.getElementById("enable-tracking");
      var attempts = 0;
      var maxAttempts = 100;

      function setStatus(message) {
        status.textContent = message;
      }

      function posthogReady() {
        return window.posthog &&
          window.posthog.__loaded &&
          typeof window.posthog.opt_out_capturing === "function" &&
          typeof window.posthog.opt_in_capturing === "function";
      }

      function whenPostHogReady(callback) {
        if (posthogReady()) {
          callback();
          return;
        }

        attempts += 1;
        if (attempts >= maxAttempts) {
          setStatus("PostHog did not finish loading. Please refresh this page and try again.");
          return;
        }

        window.setTimeout(function () {
          whenPostHogReady(callback);
        }, 100);
      }

      whenPostHogReady(function () {
        window.posthog.opt_out_capturing();
        setStatus("Tracking is currently disabled for this browser.");
      });

      enableButton.addEventListener("click", function () {
        attempts = 0;
        whenPostHogReady(function () {
          window.posthog.opt_in_capturing();
          setStatus("Tracking is enabled again for this browser.");
        });
      });
    }());
  </script>
</body>

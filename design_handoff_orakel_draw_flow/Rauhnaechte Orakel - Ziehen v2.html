<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zieh deine Karte · Rauhnächte | Nokmali</title>
<link rel="preload" as="image" href="de/rauhnaechte/orakel/art/cards/cover.webp">
<style>
@font-face{font-family:"Oracle Else";src:url("de/rauhnaechte/orakel/art/fonts/FluxischElse-Light.woff") format("woff");font-weight:300;font-display:swap}
@font-face{font-family:"Oracle Else";src:url("de/rauhnaechte/orakel/art/fonts/FluxischElse-Regular.woff") format("woff");font-weight:400;font-display:swap}
:root{--paper:#E7ECE9;--ink:#203744;--soft:#42554e;--teal:#3E6258;--teal-d:#304d48;--line:#bbc9c2;--panel:#F7F6F0;--accent:#BE9860;--display:"Oracle Else","Trebuchet MS",sans-serif;--body:"Avenir Next",Avenir,system-ui,sans-serif;
--paper-shadow:0 1px 0 #e5dbc6,0 2px 0 #b9af9b,0 3px 2px #413c3126,0 7px 10px #2037441f,0 16px 24px #20374412;
--ease:cubic-bezier(.22,1.15,.36,1);--dur:.7s;--cw:150px;--ch:225px}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
button,a{-webkit-tap-highlight-color:transparent}
a{color:var(--teal)}a:hover{color:var(--ink)}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--teal);outline-offset:4px}
.stage{position:fixed;inset:0;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr) auto;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.stage>.top{grid-area:1/1}.stage>.table{grid-area:2/1}.stage>.dock{grid-area:3/1}.stage>.reading{grid-area:2/1/4/2}
.top{grid-row:1;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 18px;min-height:60px}
.brand{display:inline-flex;align-items:center;gap:8px;font-family:var(--display);font-size:24px;color:var(--ink);text-decoration:none}
.brand img{width:36px;height:36px}
.pill{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:8px 16px;border:1px solid #3e625880;border-radius:30px;background:transparent;color:var(--teal);font-size:13px;text-decoration:none;cursor:pointer}
.pill:hover{background:#3e625810;color:var(--ink)}
.table{grid-row:2;position:relative;z-index:0;overflow-x:auto;overflow-y:hidden;overscroll-behavior:contain;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.table::-webkit-scrollbar{display:none}
.inner{position:relative;height:100%;min-width:100%}
.intro{position:absolute;left:0;right:0;top:0;z-index:0;padding:8px 24px 0;text-align:center;transition:opacity .4s ease,transform .5s ease;pointer-events:none}
.eyebrow{margin:0 0 10px;color:var(--teal);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.15em}
.intro h1{margin:0;font-family:var(--display);font-weight:300;font-size:clamp(36px,6vw,56px);line-height:1.08;letter-spacing:-.03em}
.intro p.copy{max-width:520px;margin:12px auto 0;color:var(--soft);font-size:16px;line-height:1.55;text-wrap:pretty}
.stage[data-wash] .intro,.stage:not([data-phase="deck"]) .intro{opacity:0;transform:translateY(-12px)}
.card{position:absolute;left:0;top:0;width:var(--cw);height:var(--ch);padding:0;border:0;background:transparent;cursor:pointer;transform-origin:50% 50%;will-change:transform;
transition:transform var(--dur) var(--ease),opacity .35s ease,filter .35s ease;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.card .back{position:absolute;inset:0;border-radius:12px;background:#efe4ce var(--cover) center/contain no-repeat;box-shadow:var(--paper-shadow);transition:box-shadow .3s ease}
.table.scroll .card{touch-action:pan-x}
.stage:is([data-phase="deck"]) .card .back{box-shadow:0 1px 0 #d9cfb8,0 1px 1px #463d2d1f}
.stage[data-phase="deck"] .card.base .back{box-shadow:0 1px 0 #d9cfb8,0 3px 2px #413c3126,0 10px 14px #2037441f,0 22px 30px #20374414}
.stage[data-phase="deck"] .card,.stage[data-phase="spreading"] .card{pointer-events:none}
.card .back::after{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--paper);opacity:0;transition:opacity .35s ease}
.card.dim .back::after{opacity:.55}
.card.sel .back{box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--accent),0 18px 34px #20374438,0 6px 10px #20374424}
.card:focus-visible{outline:none}.card:focus-visible .back{box-shadow:0 0 0 3px var(--teal),var(--paper-shadow)}
.card.drag{transition:opacity .35s ease;cursor:grabbing}
.no-anim .card{transition:none!important}
.hit{position:absolute;z-index:200;border:0;padding:0;background:transparent;border-radius:14px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
.hit.held{cursor:grabbing}
.stage:not([data-phase="deck"]) .hit{display:none}
.dock{grid-row:3;display:grid;justify-items:center;gap:10px;padding:10px 18px max(18px,env(safe-area-inset-bottom));text-align:center;transition:opacity .35s ease}
.stage[data-phase="reveal"] .dock{opacity:0;pointer-events:none}
.steps{display:flex;gap:18px;margin:0;padding:0;list-style:none;font-size:11px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:#42554e99}
.steps li{display:flex;align-items:center;gap:7px}
.steps li::before{content:"";width:6px;height:6px;border-radius:50%;border:1px solid currentColor}
.steps li.on{color:var(--teal)}.steps li.on::before{background:currentColor}
.steps li.done{color:var(--soft)}.steps li.done::before{background:currentColor;opacity:.5}
.say{margin:0;min-height:44px;font-size:16px;line-height:1.45;color:var(--ink);text-wrap:balance}
.say small{display:block;font-size:13px;color:var(--soft)}
.actions{display:flex;flex-wrap:nowrap;justify-content:center;gap:10px;min-height:48px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:12px 24px;border:1px solid var(--teal);border-radius:30px;background:var(--teal);color:#faf7f0;font-size:15px;text-decoration:none;cursor:pointer;transition:background .2s ease,transform .2s ease}
.btn:hover{background:var(--teal-d);color:#faf7f0}
.btn.ghost{background:transparent;color:var(--teal);border-color:#3e625880}
.btn.ghost:hover{background:#3e625810;color:var(--ink)}
.btn.appear{animation:appear .45s var(--ease) both}
@keyframes appear{from{opacity:0;transform:translateY(8px)}}
.reading{grid-row:2/4;grid-column:1;position:relative;z-index:5;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);grid-template-rows:minmax(0,1fr);align-items:center;gap:clamp(24px,4vw,56px);width:min(100%,1100px);justify-self:center;min-height:0;height:100%;padding:8px 24px max(20px,env(safe-area-inset-bottom))}
.slot{justify-self:center;height:min(80dvh,640px);aspect-ratio:2/3;perspective:1400px;transform-origin:50% 50%;will-change:transform}
.flip{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .85s cubic-bezier(.3,.7,.2,1)}
.flip.turned{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:var(--paper-shadow)}
.face.back{background:#efe4ce var(--cover) center/contain no-repeat}
.face.front{transform:rotateY(180deg);background:#efe4ce}
.face.front img{width:100%;height:100%;object-fit:cover;display:block}
.panel{display:flex;flex-direction:column;gap:0;align-self:stretch;max-height:100%;min-height:0;overflow:hidden;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--panel);box-shadow:0 12px 32px #243b4910;opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .6s var(--ease)}
.panel.show{opacity:1;transform:none}
.cue{display:none;flex-direction:column;align-items:center;gap:2px;margin:14px 0 6px;padding:6px;border:0;background:none;color:var(--teal);font-size:13px;letter-spacing:.04em;opacity:0;transition:opacity .5s ease;cursor:pointer}
.cue.show{opacity:1}
.cue span{font-size:18px;line-height:1;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{transform:translateY(4px)}}
.panel:focus{outline:none}
.panel>:not(.text){flex-shrink:0}
.panel h2{margin:0 0 12px;font-family:var(--display);font-weight:400;font-size:32px;line-height:1.15}
.panel .text{flex:1 1 auto;min-height:0;overflow:auto;padding-right:6px}
.panel .text p{margin:0 0 12px;color:var(--soft);font-size:16px;line-height:1.6;text-wrap:pretty}
.panel .text p.empty{font-style:italic}
.panel .impulse{margin:14px 0 0;padding-top:14px;border-top:1px solid var(--line)}
.panel .impulse #rIntention{margin:6px 0 0;font-family:var(--display);font-size:22px;line-height:1.35;color:var(--teal)}
.panel .actions{justify-content:flex-start;margin-top:18px}
@media (max-width:700px){
.reading{display:block;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:4px 16px max(24px,env(safe-area-inset-bottom))}
.slot{display:block;margin:0 auto;width:min(calc(100vw - 40px),calc((100dvh - 150px) / 1.5));height:auto;aspect-ratio:2/3}
.cue{display:flex!important}
.panel{margin-top:4px;padding:20px 18px;max-height:none;overflow:visible}
.panel .text{flex:none;overflow:visible;padding-right:0}
.panel h2{font-size:27px;margin-bottom:8px}
.panel .text p{font-size:15px;line-height:1.55}
.panel .impulse #rIntention{font-size:19px}
.panel .actions{justify-content:center}
.steps{gap:14px}
.top{padding:8px 14px}
.brand{font-size:21px}
}
@media (max-height:640px){.intro p.copy{display:none}.intro h1{font-size:clamp(30px,5vw,42px)}.eyebrow{margin-bottom:6px}}
@media (max-height:640px){.panel .impulse #rIntention{font-size:19px}}
@media (max-height:480px){.panel{overflow:auto}.panel .text{flex:none;overflow:visible}}
@media (prefers-reduced-motion:reduce){:root{--dur:.01s}.flip,.panel,.intro{transition:none}}
</style>
</head>
<body>
<div class="stage" id="stage" data-phase="deck">
<header class="top" data-screen-label="Orakel">
<a class="brand" href="#" aria-label="Nokmali Startseite"><img src="art/nokmali-bowl-logo.png" alt=""><span>Nokmali</span></a>
<button class="pill" id="restart" type="button" hidden>← Neu beginnen</button>
<a class="pill" id="toMed" href="#">Zu den Meditationen</a>
</header>
<div class="table" id="table">
<div class="inner" id="inner">
<div class="intro" id="intro">
<p class="eyebrow">Deine Rauhnächte · Orakel</p>
<h1>Zieh deine Karte</h1>
<p class="copy">Für einen Tag, eine Woche oder einen Monat – du entscheidest. Atme durch. Komm bei dir an. Folge deinem Gefühl.</p>
</div>
<button class="hit" id="hit" type="button" aria-label="Kartendeck. Gedrückt halten zum Mischen" aria-describedby="say"></button>
</div>
</div>
<div class="dock" id="dock">
<ol class="steps" id="steps" aria-hidden="true"><li data-s="deck">Mischen</li><li data-s="choose">Wählen</li><li data-s="reveal">Lesen</li></ol>
<p class="say" id="say" role="status" aria-live="polite"></p>
<div class="actions" id="actions"></div>
</div>
<section class="reading" id="reading" hidden aria-labelledby="rTitle">
<div class="slot" id="slot"><div class="flip" id="flip"><div class="face back"></div><div class="face front"><img id="rImg" alt=""></div></div></div>
<button class="cue" id="cue" type="button">Lesen<span aria-hidden="true">↓</span></button>
<article class="panel" id="panel" tabindex="-1">
<p class="eyebrow">Deine Karte</p>
<h2 id="rTitle"></h2>
<div class="text" id="rText" tabindex="0" aria-label="Beschreibung der Karte"></div>
<div class="impulse" id="rImpulse"><p class="eyebrow" id="rLabel">Impuls</p><p id="rIntention"></p></div>
<div class="actions"><button class="btn" id="again" type="button">Noch eine Karte ziehen ↻</button><a class="btn ghost" id="save" download>Bild speichern</a></div>
</article>
</section>
</div>
<script src="de/rauhnaechte/orakel/cards.js"></script>
<script src="orakel-v2.js"></script>
</body>
</html>
